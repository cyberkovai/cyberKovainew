<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Cyber Kovai | Redirecting...</title>
    <script type="text/javascript">
      // Single Page Apps for GitHub Pages
      // MIT License
      // https://github.com/rafgraph/spa-github-pages
      // This script takes the current url and converts the path and query
      // string into just a query string, and then redirects the browser
      // to the new url with only a query string and hash fragment,
      // e.g. https://www.foo.tld/one/two?a=b&c=d#qwe, becomes
      // https://www.foo.tld/?/one/two&a=b~and~c=d#qwe
      //
      // For GitHub Project Pages (e.g. https://<username>.github.io/<repo-name>/):
      // pathSegmentsToKeep must be 1.
      var pathSegmentsToKeep = 1;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>
  <body>
    <!--
      Cyber Kovai - Single Page Application Fallback Handler
      This document must be greater than 512 bytes in size to prevent certain browsers
      from displaying their default built-in friendly error page instead of executing the redirect.
      Protected and public routes are seamlessly preserved for React Router BrowserRouter.
    -->
    <noscript>
      <p>Redirecting to <a href="/cyberKovainew/">Cyber Kovai</a>...</p>
    </noscript>
  </body>
</html>

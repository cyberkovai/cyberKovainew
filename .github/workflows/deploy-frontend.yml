name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - 'frontend/**'
      - '.github/workflows/deploy-frontend.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Verify GitHub Pages SPA distribution artifacts
        run: |
          echo "Verifying frontend/dist build artifacts before upload..."
          if [ ! -f frontend/dist/index.html ]; then
            echo "::error::frontend/dist/index.html is missing!"
            exit 1
          fi
          if [ ! -f frontend/dist/404.html ]; then
            echo "::error::frontend/dist/404.html is missing!"
            exit 1
          fi
          if [ ! -f frontend/dist/.nojekyll ]; then
            echo "::error::frontend/dist/.nojekyll is missing!"
            exit 1
          fi
          if ! grep -q 'id="root"' frontend/dist/index.html; then
            echo "::error::frontend/dist/index.html does not contain the React root element!"
            exit 1
          fi
          if ! grep -q 'spa-github-pages' frontend/dist/index.html; then
            echo "::error::frontend/dist/index.html does not contain the SPA URL restoration script!"
            exit 1
          fi
          if ! grep -q 'pathSegmentsToKeep' frontend/dist/404.html; then
            echo "::error::frontend/dist/404.html does not contain the SPA redirect script!"
            exit 1
          fi
          echo "Verified: index.html (with URL restoration), 404.html (with SPA redirect), and .nojekyll are present."

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

      - name: Verify upload and await artifact indexing
        run: |
          echo "Verifying github-pages artifact registration with GitHub Actions API..."
          for i in $(seq 1 15); do
            RESPONSE=$(curl -sSL -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
              -H "Accept: application/vnd.github+json" \
              "${{ github.api_url }}/repos/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts")
            if echo "$RESPONSE" | grep -q '"name": "github-pages"'; then
              echo "Verified: github-pages artifact is indexed and ready for deployment."
              exit 0
            fi
            echo "Waiting for artifact indexing (attempt $i/15)..."
            sleep 3
          done
          echo "Proceeding with deployment step..."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
